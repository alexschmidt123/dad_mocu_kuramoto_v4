# SUPER FAST configuration for component verification
# This config file (fast_config.yaml) defines a lightweight experiment configuration
# This config uses MINIMAL parameters just to verify all components work
# The 'model_name' below is the identifier for where the trained model will be saved
# Estimated time: ~3-5 minutes total (vs 30 min for fast, 5-30 hours for full)
# ⚠️ NOT for actual experiments - only for testing!

# System parameters
N: 14  # IEEE-14 bus system
N_global: 15  # N + 1 for CUDA kernel

# Model type: 'second_order' (swing equation with active probing)
model_type: 'second_order'  # Use second-order Kuramoto (swing equation) with active probing

# Second-order model parameters (swing equation for IEEE-14)
swing_equation:
  topology: 'ieee14'          # IEEE-14 bus network topology
  coupling_strength: 1.0       # Base coupling strength for B matrix
  damping: 0.1                # Damping coefficient D
  base_power: 1.0              # Base mechanical power P_m
  M_lower: 0.5                 # Inertia lower bound
  M_upper: 2.0                 # Inertia upper bound
  K_lower: 0.1                 # Control gain lower bound
  K_upper: 1.0                 # Control gain upper bound
  r_max: 0.5                   # Maximum ROCOF constraint (Hz/s)
  f_min: 49.5                  # Minimum frequency constraint (Hz)
  probe_duration: 2.0          # Probe duration T (seconds)
  probe_amplitudes: [0.5, 1.0, 2.0]  # Probe amplitude options A

# Dataset generation (MINIMAL for quick verification - matches original fast_config)
dataset:
  samples_per_type: 150    # Generate 300 total (expect ~150 valid after sync filtering)
  train_size: 100          # 100 train samples (matches original fast_config)
  K_max: 1024              # Minimal: 1024 Monte Carlo samples (vs 20480 full)
  save_json: false
  
# Data generation optimization settings (for testing speed)
data_generation:
  num_workers: 4           # Use 4 parallel workers for faster generation (testing only)
  chunk_size: 10           # Samples per worker batch

# Training parameters (MINIMAL for quick verification)
training:
  model_name: "fast_test"  # Identifier for trained model directory (models/fast_test/)
  epochs: 10               # Minimal: just verify training works
  constrain_weight: 0.0001
  batch_size: 32           # Small batch for small dataset
  learning_rate: 0.001

# Experiment parameters (MINIMAL for quick verification)
experiment:
  num_simulations: 1       # Single run only
  update_count: 4          # 4 iterations = 5 steps total (0,1,2,3,4) - OPTIMAL: leaves room for method differences
  it_idx: 3                # Minimal iterations (matches original fast_config)
  K_max: 1024              # Match dataset K_max (matches original fast_config)
  methods:
    - "RANDOM"             # PyCUDA methods FIRST
    - "ENTROPY"
    - "ODE"
    - "iNN"                # PyTorch methods AFTER
    - "NN"
    - "REGRESSION_SCORER"  # Regression Scorer baseline
    - "DAD_MOCU"           # DAD-MOCU (no critic, simple baseline, uses per-step rewards)
    - "IDAD_MOCU"          # iDAD-MOCU (with critic from scratch, uses per-step rewards)

# DAD policy training data generation
dad_data:
  num_episodes: 1000       # Number of trajectories to generate (increased for better training)
  K: 4                     # Number of sequential experiments per trajectory (4 design steps, OPTIMAL: 40% of pairs, leaves room for differences)
  use_precomputed_mocu: true  # Pre-compute terminal MOCU using MPNN predictor (recommended)

# Paths (relative to project root)
paths:
  data_dir: "data"
  models_dir: "models"
  results_dir: "results"

