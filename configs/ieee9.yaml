# WSCC/IEEE 9-bus EIG: fixed amplitude, discrete duration and bus actions.
#
# The physical 9-bus lossless network is Kron-reduced onto its three dynamic
# generator buses (physical buses 1, 2, 3).  In this reduced ODE, indices
# [0,1,2] map to physical buses [1,2,3]. Every probe is a separate experiment
# starting from equilibrium.

system:
  name: ieee9

# Number of retained dynamic buses, not the number of physical network buses.
N: 3

data:
  dataset_dir: data/ieee9_duration_bus
  generate_if_missing: false

observation:
  # Use sampled frequency trajectories; scalar max-ROCOF was too compressed.
  N_obs: 200
  sampling: uniform
  noise_sigma: 0.005

oracle:
  tolerance: 1.0e-4

swing_equation:
  topology: ieee9
  physical_bus_count: 9
  dynamic_machine_buses: [1, 2, 3]
  retained_bus_map: [1, 2, 3]
  # Probe may be injected at any physical bus; frequency is measured by a
  # fixed PMU at physical generator/slack bus 1.
  observation_bus: 1
  base_frequency_hz: 60.0
  base_power_mva: 100.0
  coupling_strength: 1.0
  damping: 0.0

  # Six-dimensional latent state on the three physical generator buses:
  # theta=(M_1,M_2,M_3,K_1,K_2,K_3). Each coordinate is sampled independently.
  # Nominal inertia uses H=[23.64,6.40,3.01] s and M=2H/(2*pi*60);
  # the bounds are +/-30% around each machine's nominal M.
  latent_model: machinewise_mk
  M_lower_nodes: [0.0877898665, 0.0237671385, 0.0111779822]
  M_upper_nodes: [0.1630383235, 0.0441389715, 0.0207591098]
  # Preserve the established IEEE9 fast-response scale and nominal spatial
  # participation, but make K_1, K_2, and K_3 independent latent coordinates.
  K_lower_nodes: [0.029375, 0.013125, 0.007500]
  K_upper_nodes: [0.293750, 0.131250, 0.075000]
  use_node_specific_damping: true
  D_nodes: [0.012541410, 0.003395306, 0.001596855]

  # Exact equilibrium is derived from the reduced network and theta0.
  P_m_nodes: [0.0, 0.0, 0.0]
  theta0_nodes: [0.0, 0.0, 0.0]
  omega0_nodes: [0.0, 0.0, 0.0]
  enforce_initial_equilibrium: true

  # Fixed-amplitude, discrete-duration design at all 9 physical buses.
  # Code indices 0..8 map to physical bus numbers 1..9.
  probe_buses: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  probe_amplitudes: [0.05]
  probe_durations: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  # Shared-code fallback when probe_durations is absent; not used by this catalog.
  probe_duration: 2.0
  reset_after_probe: true
  T_obs_sec: 4.0
  # Short 0.2 s pulses need 640 Hz integration for <1% CPU/CUDA discrepancy.
  ode_dt: 0.0015625
  # 40 Hz divides the 160 Hz ODE rate exactly (four solver steps/sample).
  fs_hz: 40.0
  sigma: 0.2

prior:
  mc_samples: 512
  mc_support_seed: 1

experiment:
  mode: duration_bus_reset
  step_number: 3
  methods: [dad, rl_sboed, moe_sboed, myopic, fixed, random]
  experiment_type: eig_based

# Retained for the shared code path; EIG does not optimize this terminal MOCU.
control:
  alpha: 0.01
  safety_margin: 0.0
  rocof_limit_hz_s: 22.0
  delta_f_nadir_hz: -0.2
  T_obs_sec: 10.0
  ode_dt: 0.00625
  fs_hz: 40.0
  contingency: {bus: 0, magnitude: -0.45, units: pu}
  profile: {bus: 0, t_start: 0.0, duration: 10.0, shape: step, units: pu}
  u_candidates: [0.0, 0.045, 0.09, 0.135, 0.18, 0.225, 0.27, 0.315, 0.36, 0.405, 0.45]
  myopic_hypothetical: 64
  fixed_exhaustive_threshold: 0
  fixed_noise_replicas: 2
  fixed_greedy_restarts: 8

data_generation:
  backend: cuda
  cuda_batch_size: 128
  theta_sample_size_train: 512
  theta_sample_size_test: 128
  train_seed: 101
  test_seed: 202

bank_quality:
  enabled: false

training:
  use_bank_observations: true
  device: auto
  eig_epochs: 200
  eig_steps_per_epoch: 512
  batch_size: 256
  learning_rate: 0.0003
  entropy_coef: 0.05
  policy_hidden: 256
  eig_validation_systems: 128
  eig_bc_trajectories: 96
  eig_bc_lookahead: two_step
  eig_bc_temperature: 0.5
  eig_bc_fantasies: 12
  eig_rl_use_ppo: true
  eig_moe_ppo_epochs: 4
  eig_moe_ppo_clip: 0.2
  eig_moe_critic_lr: 0.001
  # Real MoE: do not CE-clone two-step/myopic into fused logits.
  eig_moe_cf_coefficient: 0.0
  eig_moe_cf_anneal_fraction: 0.0
  eig_moe_cf_floor_fraction: 0.0
  eig_moe_cf_rollouts_per_batch: 0
  # Step 0 is expert 0; keep it trainable so PPO can improve the first probe.
  eig_moe_freeze_base_after_bc: false
  eig_moe_leave_base_coefficient: 0.0
  eig_moe_leave_base_margin: 0.5
  eig_moe_branching_coefficient: 0.15
  eig_moe_low_ess_residual_coefficient: 0.10
  eig_moe_low_ess_threshold: 0.4
  eig_moe_residual_scale_coefficient: 0.05
  eig_moe_logit_scale_target: 3.5
  # Encourage confident, belief-dependent expert selection while the balance
  # term prevents one-expert collapse. This operates only inside MoE-sBOED.
  eig_moe_balance_coefficient: 0.005
  eig_moe_routing_information_coefficient: 0.01
  eig_moe_redundancy_coefficient: 0.02
  eig_prefer_unique_sequence_floor: true
  eig_min_unique_sequence_fraction: 0.08
  eig_unique_floor_slack: 0.03

control_safety_calibration:
  enabled: false
  mode: config
  expected_alpha: 0.01
