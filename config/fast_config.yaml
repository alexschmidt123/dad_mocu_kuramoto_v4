# Fast Configuration for Quick Testing
# Based on documents/design_part1.tex and design_part2.tex
# 
# Use this for quick testing and component verification
# Estimated Runtime: ~1 hour on RTX 4090
# ⚠️ NOT for actual experiments - only for quick testing!

# System parameters
N: 14  # IEEE-14 bus system
N_global: 15  # N + 1 for CUDA kernel

# Model type: 'second_order' (swing equation with active probing)
model_type: 'second_order'  # Use second-order Kuramoto (swing equation) with active probing

# Second-order model parameters (swing equation for IEEE-14)
swing_equation:
  topology: 'ieee14'          # IEEE-14 bus network topology
  coupling_strength: 1.0       # Base coupling strength for B matrix
  damping: 0.1                # Damping coefficient D
  base_power: 1.0              # Base mechanical power P_m
  M_lower: 0.01                # M = 2H/ω_s; H ∈ [2.3, 5] s → M ∈ [0.01, 0.06]
  M_upper: 0.06                # Inertia upper bound (physical range from Kundur)
  K_lower: 0.05                # Control gain lower bound (5% droop equivalent)
  K_upper: 0.50                # Control gain upper bound (50% response)
  r_max: 0.1                   # Maximum ROCOF constraint (Hz/s) - tightened for non-trivial control
                                # Reference: ENTSO-E grid codes use 0.5-1.0 Hz/s for protection
                                # We use 0.1 Hz/s (stricter) to ensure control is needed
  f_min: 59.8                   # Minimum frequency constraint (Hz), 60 Hz nominal (USA)
                                # Normal band 59.5-60.5 Hz; we use 59.8 (stricter) to require control
  probe_duration: 2.0          # T_p = 2 s (design_part1.tex)
  probe_amplitudes: [0.05, 0.1, 0.2]  # A_t in A
  fs_hz: 12.0                  # Observation: design_part1.tex Section 4
  rocof_window_sec: 0.5
  rocof_eval_sec: 1.0
  T_obs_sec: 10.0

# Dataset generation (minimal for ~1 hour runtime)
dataset:
  samples_per_type: 30     # Minimal samples for quick testing
  train_size: 24           # 80% for training (30 * 0.8 = 24)
  K_max: 64                # Reduced for speed with tighter constraints (was 128)
                           # Rationale: 64 samples provide ~12.5% relative error (acceptable for fast testing)
                           # With tighter constraints (r_max=0.1), binary search is slower, so reduce K_max
  save_json: false
  
# Data generation optimization settings (for testing speed)
data_generation:
  num_workers: 1           # Use 1 worker (sequential) - CUDA multiprocessing can hang
  chunk_size: 10           # Samples per worker batch

# Training parameters (minimal for quick testing)
training:
  model_name: "fast_config"  # Model folder: models/fast_config/ (MPNN + DAD + loss curves)
  epochs: 50              # Minimal epochs for quick testing
  constrain_weight: 0.0001
  batch_size: 16          # Small batch for small dataset
  learning_rate: 0.001

# Experiment parameters (minimal for ~1 hour runtime)
# Bounds enforce min width (2% of base range) so MOCU does not collapse to 0; keeps problem non-trivial.
experiment:
  num_simulations: 1       # Single run only (for quick testing)
  update_count: 4          # 4 iterations = 5 steps total (0,1,2,3,4)
  it_idx: 3                # Minimal MOCU averaging iterations
  K_max: 64                # Match dataset K_max (reduced for speed with tighter constraints)
  methods:
    - "RANDOM"             # Random probe selection (fast)
    - "ENTROPY"             # Entropy-based probe selection (fast)
    - "ODE"                 # ODE (sampling-based) baseline: ground-truth MOCU, important for comparison (slower)
    - "iNN"                 # Iterative MPNN MOCU predictor (fast)
    - "NN"                  # Static MPNN MOCU predictor (fast)
    # DAD method (evaluated in step 6 if policy trained)
    # - "DAD"                 # DAD (no critic, simple baseline, uses per-step rewards)

# DAD policy training data generation
dad_data:
  num_episodes: 1000       # Number of trajectories to generate (increased for better training)
  K: 4                     # Number of sequential experiments per trajectory (4 design steps, OPTIMAL: 40% of pairs, leaves room for differences)
  use_precomputed_mocu: true  # Pre-compute terminal MOCU using MPNN predictor (recommended)

# Paths (relative to project root)
paths:
  data_dir: "data"
  models_dir: "models"
  results_dir: "results"

