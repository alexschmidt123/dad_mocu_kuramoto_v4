# Early Test Configuration
# Runs only RANDOM, ENTROPY, ODE (the three fundamental baselines).
# ODE is the base for iNN/NN; iNN/NN is the base for DAD.
# Use this to verify baselines work before running the full pipeline.

# System parameters
N: 14
N_global: 15
model_type: 'second_order'

swing_equation:
  topology: 'ieee14'
  coupling_strength: 1.0
  damping: 0.1
  base_power: 1.0
  M_lower: 0.01
  M_upper: 0.06
  K_lower: 0.05
  K_upper: 0.50
  r_max: 0.5
  f_min: 49.8
  reference_probe_bus: 0
  reference_probe_amplitude: 0.5
  reference_probe_duration: 2.0
  probe_duration: 2.0
  probe_amplitudes: [0.05, 0.1, 0.2]
  fs_hz: 12.0
  rocof_window_sec: 0.5
  rocof_eval_sec: 1.0
  T_obs_sec: 10.0
  sigma: 0.10

dataset:
  samples_per_type: 20
  train_size: 16
  K_max: 64
  save_json: false

data_generation:
  num_workers: 1
  chunk_size: 10

training:
  model_name: "early_test"
  epochs: 20
  constrain_weight: 0.0001
  batch_size: 16
  learning_rate: 0.001

# Early test: RANDOM, ENTROPY, ODE only (no iNN, NN, DAD)
experiment:
  num_simulations: 2
  update_count: 4
  it_idx: 2
  K_max: 64
  methods: [RANDOM, ENTROPY, ODE]
  uncertainty_ratio_min: 1.0
  update_strength: 0.05

dad_data:
  num_episodes: 100
  K: 4
  use_precomputed_mocu: true

paths:
  data_dir: "data"
  models_dir: "models"
